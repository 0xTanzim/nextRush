# NextRush OpenSpec project configuration.
# Workflow: built-in `spec-driven` (proposal -> specs/design -> tasks -> apply).
#
# OpenSpec config contract:
#   context  -> artifact creation plus apply/archive.
#   rules    -> additive guidance for the matching artifact ID only.
#   operations.apply/archive.guidance -> advisory guidance for those operations.
#
# `operations` requires OpenSpec >= 1.7.0 (introduced after 1.6.0).
# This configuration was checked against the 1.16.1 spec-driven schema.
# Keep generic OpenSpec mechanics in the built-in schema; this file adds NextRush
# engineering constraints. AGENTS.md remains the engineering constitution.

schema: spec-driven

context: |
  NEXT RUSH
  NextRush is a TypeScript-first, ESM-only, multi-runtime backend HTTP framework in a
  pnpm/Turborepo monorepo. Node.js support starts at >=22.0.0; supported targets also
  include Bun, Deno, Web/Edge, and serverless environments. The Web Platform is the
  portable foundation. Runtime-specific behavior belongs behind adapters and negotiated
  capabilities; core, router, and portable middleware must not depend on adapters or
  import runtime-specific APIs.

  ENGINEERING AUTHORITY
  - `AGENTS.md` is the project-wide engineering constitution; follow it.
  - `openspec/README.md` is the capability ownership registry and governance guide.
  - `openspec/specs/` is the living behavioral contract. Discover its current inventory
    with `openspec list --specs`; never rely on a remembered count or duplicate registry.
  - Source and tests show current implementation; specs describe intended behavior.
    When they disagree, record the mismatch and resolve it rather than silently choosing.
  - Durable architecture decisions belong in approved `docs/RFC/` and `docs/adr/` records.
  - Read applicable package guidance, architecture docs, skills under `.agents/skills/`,
    scripts, and templates. Verify each path exists; do not rely on stale references.

  SPEC GOVERNANCE
  Treat capability specs as a small, stable map of durable framework responsibilities,
  not one folder per feature, package, optimization, or change. Prefer deltas to existing
  capabilities. Create a capability only when a genuinely new durable responsibility has
  no appropriate owner; justify that boundary against `openspec/README.md`.
  If externally observable behavior does not change (pure refactor, internal optimization,
  docs-only, or tooling-only work), use `skip_specs: true` in the change's `.openspec.yaml`.
  Never invent a requirement merely to satisfy validation.
  `openspec/changes/archive/` is disposable history under the repository's retention policy.
  Git is the durable change history. Promote lasting decisions to an approved RFC/ADR
  before archive; never leave the only rationale in a disposable archive.

  ARCHITECTURE AND HARD CONSTRAINTS
  Correctness, security, compatibility, and runtime portability are hard gates; performance
  never compensates for weakening them. Keep public APIs small and stable, preserve package
  dependency direction, and keep optional features out of default entrypoints unless justified.
  Choose behavior through capabilities, not runtime-name branching. Document and test real
  capability differences instead of promising unsupported parity.
  New packages, new capabilities, public API/Context, routing, middleware, DI, adapter-contract,
  and breaking changes are RFC-gated under the policy in `AGENTS.md`. Breaking public contracts
  need a migration path and explicit semver/release treatment.

  SYSTEMS-LEVEL ENGINEERING
  Follow `AGENTS.md` §6-§7 for the full performance cost model and profiling playbook. For
  relevant changes, trace the complete path and reason across algorithmic complexity, data
  structures, allocation/object lifetime, GC, JIT/compiler behavior, CPU execution, memory
  hierarchy/cache locality, virtual memory/pages/TLB, scheduling/context switches, event-loop
  behavior, syscalls, I/O, and backpressure. Select only the layers relevant to the workload.
  Distinguish what TypeScript controls, influences, and can only observe: do not imply direct
  control over physical cache lines, memory banks, registers, or kernel scheduling. Treat
  low-level explanations as hypotheses until supported by source, profiles, or measurements.
  Small gains (including ~1%) are legitimate when repeatable, above measurement noise, and
  relevant to real workloads. Do not reject them by size alone; do not accept noisy results.

# Rules augment the built-in schema. Artifact IDs are: proposal, specs, design, tasks.
rules:
  proposal:
    - >-
      Before selecting capabilities, run `openspec list --specs`, consult the ownership
      registry in `openspec/README.md`, and read relevant living specs in full with
      `openspec show "<spec-id>" --type spec`. Use exact existing paths; do not infer them
      from package names or archived changes.
    - >-
      State the concrete problem, user/framework impact, evidence or reproduction when
      available, scope, non-goals, affected packages/runtimes, and compatibility impact.
      Keep proposal focused on WHY and WHAT; implementation belongs in design.md and
      work breakdown belongs in tasks.md.
    - >-
      List Modified Capabilities only when externally observable requirements change.
      A new capability needs a durable responsibility with no existing owner and a clear
      justification. For work with no contract change, set `skip_specs: true`; do not
      fabricate spec deltas.
    - >-
      Mark breaking changes explicitly. Identify affected exports, public types, Context,
      routing, middleware order, DI, adapter/runtime contracts, migration, and release
      implications where relevant. Apply the RFC gate from `AGENTS.md` before implementation.

  specs:
    - >-
      Specify observable contracts for framework users, downstream packages, and runtime
      integrations: inputs, outputs, ordering, errors, lifecycle, cancellation, limits,
      security, and portability where relevant. Do not put internal class/function names,
      data structures, dependency choices, or implementation steps in behavioral specs.
    - >-
      Target exact capability paths discovered from `openspec list --specs` and owned by
      `openspec/README.md`. For cross-capability behavior, create one focused delta per true
      owner; do not duplicate requirements. A new capability folder is exceptional and must
      meet the durable-responsibility test in the project context.
    - >-
      Preserve OpenSpec delta syntax. Every requirement needs a scenario using exactly
      `#### Scenario:`; every scenario needs a GIVEN or WHEN trigger and a THEN outcome.
      Keep normative descriptions to one behavior and <=500 characters where possible;
      put edge cases and variants in scenarios. Use SHALL/MUST for normative contracts.
    - >-
      For MODIFIED, copy the complete existing requirement block, including every scenario,
      preserve its exact heading, then edit the full block. Use ADDED for a new concern that
      does not change existing behavior. REMOVED requires Reason and Migration. RENAMED is
      name-only and uses FROM:/TO: markers. Do not add `## Purpose` to an existing capability
      delta; a new capability delta needs a meaningful Purpose of at least 50 characters.

  design:
    - >-
      Follow the built-in criteria for including design.md. Include it for cross-package or
      cross-runtime changes, new architecture, dependencies/data models, security/performance/
      migration complexity, or decisions that must be settled before implementation. Omit it
      for genuinely trivial changes.
    - >-
      Trace the real affected execution path: startup/registration, adapter, core, router,
      middleware, handler, response emission, and teardown/cleanup as applicable. Show package
      boundaries, ownership, dependency direction, and why the change belongs at that layer.
      Verify against source and architecture docs; do not assume the diagram is current.
    - >-
      For performance work, identify the metric and bottleneck, separate source-confirmed facts
      from hypotheses, and state what evidence supports each hypothesis. Analyze relevant layers:
      complexity/data structure, allocations and GC, JIT/deopts/object shapes, CPU work, cache
      locality/pointer chasing, memory/pages/TLB, event-loop/scheduling/context switches, syscalls,
      I/O, and backpressure. State why a layer is irrelevant or not observable when omitted.
    - >-
      Performance designs must define baseline, workload, runtime/tool versions, warm-up,
      repetitions, variance/noise, and the end-to-end metric expected to move. Prefer the existing
      harness under `apps/benchmark/`; run `pnpm bench:validate` from that workspace (or `pnpm --filter nextrush-benchmark bench:validate` from the repository root) before timing when response parity
      matters. Use controlled multi-run A/B and disjoint server/client CPU pinning where supported.
      Disclose host interference, unavailable hardware counters, and non-publishable runs.
      Micro-benchmarks support an explanation; they do not replace end-to-end evidence.
    - >-
      For runtime-facing work, describe the portable contract, affected runtime/capability matrix,
      fallback/refusal behavior, and conformance evidence. For security/lifecycle-sensitive work,
      analyze trust boundaries, malformed input, resource exhaustion, fail-open/closed behavior,
      concurrency/reentrancy, abort/cancellation, timeout, partial writes, ownership, and cleanup.
    - >-
      Explain decisions, alternatives rejected, invariants, trade-offs, risks, and mitigations.
      Link governing RFCs/ADRs rather than copying them. Resolve open questions that could change
      requirements, architecture, or task order before drafting tasks; leave only deferrable
      questions open.

  tasks:
    - >-
      Use the built-in tracked checkbox format under numbered headings. Each task must be a
      reviewable unit and state its own completion evidence: exact test/command, observable
      behavior, type/API check, conformance result, benchmark result, or delivered artifact.
    - >-
      Order work by dependency and implement in coherent vertical slices. Each group includes
      the tests and documentation its changes require; do not defer all testing/docs to a final
      catch-all group. Reserve final groups for genuinely cross-cutting integration checks.
    - >-
      Use RED -> GREEN -> REFACTOR for behavior changes: establish a failing regression test
      before production code when practical. Do not invent TDD steps for docs-only/config-only
      changes; specify the appropriate parser, schema, formatting, or instruction-output check.
    - >-
      Select test layers by risk: unit, boundary/negative, property/fuzz, integration, lifecycle/
      concurrency, compile-time public type/export, generated-project, and runtime-conformance.
      Test error paths, cancellation, cleanup, and resource bounds where the contract requires them.
    - >-
      For adapter or portable-contract changes, test every affected supported runtime through
      `packages/adapters/conformance`. Prove common behavior and explicitly document/test capability
      differences; never infer universal parity from one runtime.
    - >-
      Use real package scripts and root verification. Preserve the existing per-package coverage
      thresholds (90% lines / 85% branches) from `scripts/check-coverage.ts`; inspect its current
      exclusions and never widen/remove them to make a change pass. Run relevant lint, strict
      type-check, build, tests, and `pnpm verify` in proportion to scope. Never invent commands
      or claim a check that was not run.
    - >-
      For performance changes, include contract/parity tests, a measured baseline and before/after
      result using the existing harness, and a regression guard when justified. Prefer repeated
      controlled runs, report spread, and pin server/client to disjoint cores where supported.
      Retain modest improvements when repeatable and above noise; redesign/revert unsupported wins.
    - >-
      If a published package's behavior or public surface changes, include the required Changeset,
      release notes, and migration documentation. Do not add release artifacts for private
      tooling or docs-only work unless repository policy requires them.

operations:
  apply:
    guidance:
      - >-
        Before editing, inspect `git status` and relevant diffs, applicable AGENTS.md files,
        package scripts, source, tests, specs, and governing RFC/ADR. Preserve user work and
        avoid unrelated cleanup.
      - >-
        Treat tasks.md as the approved execution plan. Work in dependency order, keep checkboxes
        current, and do not broaden scope silently. If source evidence contradicts a spec/design,
        reconcile the artifacts before coding around the discrepancy.
      - >-
        Add tests/docs with the task group that needs them. Do not mark a task complete until
        its stated verification actually ran and passed. Report blocked or unavailable checks.
      - >-
        For performance work, profile the real path, change one variable at a time, and compare
        under controlled conditions. Keep only wins above noise that preserve correctness,
        security, compatibility, and behavior on affected runtimes.
      - >-
        Update proposal/spec/design/tasks when approved scope or contract changes. Record new
        risks and evidence; never silently drift from the accepted design.

  archive:
    guidance:
      - >-
        Do not archive merely because implementation appears finished. Confirm every tracked
        task, required test/doc/release item, and applicable verification is complete; disclose
        anything unrun or blocked.
      - >-
        Compare implementation with every delta scenario. Review the resulting living specs for
        missing behavior, duplicated requirements, accidental deletion, correct Purpose, and
        consistency with shipped behavior.
      - >-
        Promote lasting decisions to approved RFC/ADR records before archive. Preserve the
        existing capability ownership model; do not create change-shaped folders or alter
        unrelated living specs during sync.
      - >-
        Inspect the final diff after archive and report exact files, verification results,
        known limitations, and any unresolved maintainer decision.
