# OpenSpec project config for NextRush.
# Schema: the built-in `spec-driven` workflow (artifacts: proposal → specs → design → tasks).
#   Verified against @fission-ai/openspec 1.6.0 — schemas/spec-driven/schema.yaml.
#
# How this file is consumed (do not guess — this is the actual contract):
#   • `context:`  is injected into EVERY artifact prompt.
#   • `rules:`    are injected ONLY for the artifact whose id matches the key.
#                 The artifact ids are EXACTLY: proposal · specs · design · tasks.
#                 A rules key that is not one of those four is silently ignored —
#                 e.g. `spec:` (singular) matches nothing and never reaches the AI.
#   • Keep generic OpenSpec mechanics (delta headers, #### scenarios, checkbox
#     tracking) in the schema's own instructions; this file adds NextRush-specific
#     governance on top, plus a few reinforced "fails-silently" traps worth repeating.
schema: spec-driven

# ── Project context (injected into ALL artifacts) ──────────────────────────────
context: |
  NextRush — minimal, modular, high-performance, ESM-only Node.js HTTP framework
  (TypeScript strict, pnpm/Turborepo monorepo, Node >= 22). Conventional commits.
  Engineering constitution: AGENTS.md. Repo rules: .kiro/steering/*.instructions.md.

  ── SPEC GOVERNANCE — READ BEFORE CREATING ANY CHANGE ───────────────────────────
  `openspec/specs/` is a SMALL, STABLE set of capability specs (16) describing what the
  framework does TODAY. It is the source of truth we actually read. It must NOT grow
  one-folder-per-change.

  THE ONE RULE: a change EDITS an EXISTING capability's requirements (ADDED / MODIFIED /
  REMOVED / RENAMED). It does NOT create a new `specs/<capability>/` folder unless a
  genuinely new, durable capability is being born (rare — expect to justify it).

  FIXED CAPABILITY LIST (see openspec/README.md for what each owns):
    router · core-middleware · node-adapter · web-adapters · body-parser ·
    portable-middleware · graceful-shutdown · health · performance-gate ·
    runtime-adapter-contract · runtime-capability-negotiation · runtime-proof-harness ·
    serverless-adapter · adapter-development-kit · public-surface-lock · gap-checklist-accuracy

  A capability is named after a DURABLE thing (`router`, `node-adapter`), never after a
  change (`router-match-path-allocation-trim`, `*-fastpath`, `*-trim`, `*-cleanup`,
  `*-microtrims`, `*-final-*`). Every capability spec has a real `## Purpose` — never a
  "TBD - created by archiving…" stub.

  ── ARCHIVE IS DISPOSABLE ────────────────────────────────────────────────────────
  `changes/archive/` is gitignored local scratch — never read for truth, safe to delete
  anytime. Git commit history is the record of shipped changes. Durable architectural
  decisions ("why segment-trie", "why ESM-only") live in `docs/RFC/` as RFCs/ADRs and
  MUST be captured there BEFORE a change is archived — never only in a prunable archive.

  ── RFC GATING ─────────────────────────────────────────────────────────────────
  A new package, a new capability, a public-API/Context/routing/middleware/DI/adapter
  change, or any breaking change is RFC-gated: an approved `docs/RFC/` entry precedes
  implementation. The RFC defines the architecture; the change's tasks validate it (TDD).
  New RFCs/ADRs follow the templates: docs/RFC/TEMPLATE.md · docs/adr/TEMPLATE.md.

# ── Per-artifact rules (key MUST equal the artifact id, or it is dropped) ───────
rules:
  # id: proposal — WHY. Maps to the schema's Why / What Changes / Capabilities / Impact.
  proposal:
    - In the Capabilities section, put the change under "Modified Capabilities" naming the
      EXISTING capability from the fixed list; leave "New Capabilities" empty unless a genuinely
      new durable capability is born (and justify why it is not requirements added to an existing one).
    - Keep it tight — Why / What changes / Capabilities / Impact. No implementation-detail dumps,
      no restated tasks. Mark any breaking change **BREAKING**.
    - A breaking public-API change ships a migration path and is RFC-gated (docs/RFC/) before code.
    - Never use change-shaped capability names (*-fastpath, *-trim, *-cleanup, *-microtrims, *-final-*).
    - Note the durable decision, if any, that must land in docs/RFC/ before this change is archived.

  # id: specs — WHAT (the delta). NOTE: key is `specs`, NOT `spec` — `spec:` is silently ignored.
  specs:
    - Write deltas against an EXISTING capability under the delta headers
      ADDED / MODIFIED / REMOVED / RENAMED Requirements (## level). Do NOT spin up a
      new specs/<capability>/ folder for a change.
    - Scenarios MUST use exactly four hashtags (`#### Scenario:`) with WHEN/THEN — three hashtags
      or a bullet FAILS SILENTLY (strict-validated, but the miss is easy to ship). Every
      `### Requirement:` has at least one `#### Scenario:`.
    - MODIFIED requirements MUST paste the ENTIRE requirement block (heading through all scenarios)
      copied from openspec/specs/<capability>/spec.md, then edited — partial content loses detail at
      archive. If you are only adding a new concern, use ADDED, not MODIFIED.
    - REMOVED requirements MUST include a **Reason** and a **Migration** note; RENAMED uses FROM/TO markers.
    - Requirement text is a contract — precise, testable, phrased with SHALL/MUST (avoid should/may).
      Titles are unique within a capability; prefer MODIFIED over adding a near-duplicate requirement.
    - Capability specs stay kebab-case, durable-named, with a real `## Purpose` (never a TBD stub).

  # id: design — HOW. Optional; skip for trivial changes (the schema gates when it's needed).
  design:
    - Only write design.md for architecturally non-trivial changes; skip it for a one-line fix.
    - Record WHY — Decisions (why X over Y, alternatives rejected), Risks/Trade-offs, constraints —
      not a restatement of tasks.
    - Link the governing docs/RFC/ entry when the change implements or extends an RFC; do not
      duplicate the RFC's content — reference it.
    - Respect the package hierarchy (lower never imports from higher) and the zero-dependency core rule.

  # id: tasks — the implementation checklist. Checkbox format is load-bearing (parsed by apply).
  tasks:
    - Every task MUST be a checkbox `- [ ] X.Y <description>` under a `## <n>. <group>` heading —
      tasks not in `- [ ]` form are NOT tracked by the apply phase.
    - Order test-first (RED -> GREEN -> REFACTOR); no production code before a failing test exists.
    - Keep tasks small and independently verifiable — one concern per task, done in one session.
    - Where any adapter is touched, include a cross-adapter conformance/parity task
      (packages/adapters/conformance) — observable behavior must stay identical across runtimes.
    - Include the gate checks as explicit tasks — per-package line coverage stays at or above 90%,
      ESLint clean, and tsc strict clean.
    - Performance work is correctness-first and measurement-gated (bench:validate + a CPU-pinned A/B).
