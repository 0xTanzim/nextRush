name: Docs (GitHub Pages)

on:
  # Cloudflare Pages is the automatic production docs deployment. Keep this
  # workflow available for an explicit GitHub Pages build without duplicating
  # every docs deployment and paying for two Linux runners.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  # cloudflare/pages-action@v1 creates a synthetic GitHub "Deployment" record
  # via POST /repos/{owner}/{repo}/deployments. Without this the action fails
  # with `403 Resource not accessible by integration`. Least privilege.
  deployments: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build docs (static export)
        env:
          NEXTRUSH_REPO_BRANCH: main
          NEXTRUSH_DOCS_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm turbo run build --filter=website...

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
