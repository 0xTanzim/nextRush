name: Deploy Website (Cloudflare Pages)

on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "scripts/docs/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build website (static export)
        env:
          NEXTRUSH_REPO_BRANCH: main
          NEXTRUSH_DOCS_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://nextrush.dev
        run: pnpm turbo run build --filter=website...

      - name: Deploy to Cloudflare Pages
        # `cloudflare/pages-action` was deleted upstream, and `wrangler-action@v4`
        # installs its CLI with a bare `pnpm add wrangler@X` in the repo root — inside a
        # pnpm workspace that aborts with ERR_PNPM_ADDING_TO_ROOT (run 40262436433).
        # Committing wrangler as a website devDependency would drag a deploy-only
        # dependency tree into every `pnpm install --frozen-lockfile` job, so the pinned
        # CLI runs from a throwaway store instead. Trade-off: no synthetic GitHub
        # "Deployment" record — this run is the audit trail.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: pnpm dlx wrangler@4.152.0 pages deploy apps/website/out --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main
