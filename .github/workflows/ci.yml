name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The published-artifact proof is intentionally manual-only. Running the full
  # Docker/package-manager/runtime matrix nightly launched every CI job and caused
  # repeated failed runner usage without providing useful signal.
  workflow_dispatch:

# Align JS action runtime with Node 24 (see https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/ )
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Pull request — changeset guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" > changed-files.txt
          node <<'NODE'
          const fs = require('node:fs');

          const changed = fs
            .readFileSync('changed-files.txt', 'utf8')
            .split('\n')
            .map((line) => line.trim())
            .filter(Boolean);

          const isChangeset = (file) =>
            file.startsWith('.changeset/') && file.endsWith('.md') && file !== '.changeset/README.md';

          const isReleaseImpactingPackageChange = (file) => {
            if (!file.startsWith('packages/')) return false;
            if (/(^|\/)__tests__(\/|$)/.test(file)) return false;
            if (/\.(test|spec)\.[cm]?[jt]sx?$/.test(file)) return false;
            if (file.endsWith('.md') || file.endsWith('.mdx')) return false;
            return true;
          };

          const changesetTouched = changed.some(isChangeset);
          const impactingPackageChanges = changed.filter(isReleaseImpactingPackageChange);

          if (impactingPackageChanges.length > 0 && !changesetTouched) {
            console.error('Release-impacting package changes were detected without a changeset file.');
            console.error('Add one with: pnpm changeset');
            console.error('Changed files requiring a changeset:');
            for (const file of impactingPackageChanges) {
              console.error(` - ${file}`);
            }
            process.exit(1);
          }

          console.log('Changeset guard passed.');
          NODE

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      # The parity smoke test and generated-example test (packages/create-nextrush) resolve
      # `nextrush` + `@nextrush/dev` through examples/dev-cli-fixture/node_modules, which
      # symlinks into packages/*. Turbo's `test` task depends only on the owning package's
      # own `build` (no `^build` edge, and create-nextrush correctly declares no dependency
      # on nextrush), so nothing orders `nextrush:build` before `create-nextrush:test` — it
      # only won on cache hits. Build the fixture deps explicitly so dist/ exists
      # deterministically, matching the install-matrix and cross-platform jobs.
      - name: Build fixture workspace dependencies (nextrush, @nextrush/dev)
        run: pnpm turbo run build --filter=dev-cli-fixture...

      - name: Build, test, typecheck, lint
        run: pnpm verify

  # project-scaffolding-hardening (RFC-021 / ADR-0011 / task 2.1 & 7.3): the system-of-record
  # verifier for the P0 install-integrity claim — scaffolds every style x runtime x middleware
  # combination and asserts each emitted dependency range resolves against its OWN package's
  # real published (workspace) version, never a proxy for another package's version. This job
  # is what turns "the generator produces structurally correct output" (already covered by
  # `pnpm verify` above) into "the generator produces an INSTALLABLE output" — the exact gap
  # that let F-01 ship (report/scaffolding/scaffolding-cli-review.md).
  create-nextrush-install-matrix:
    # Keep the full generated-install matrix on PRs and explicit manual runs;
    # the core CI job already validates pushes to main.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build workspace packages the matrix resolves versions against
        run: pnpm --filter "create-nextrush..." build

      # The parity smoke test symlinks examples/dev-cli-fixture/node_modules, so
      # nextrush + @nextrush/dev (fixture deps) must have dist built in this job.
      - name: Build fixture workspace dependencies (nextrush, @nextrush/dev)
        run: pnpm turbo run build --filter=dev-cli-fixture...

      - name: Generate-then-install matrix (every style x runtime x middleware cell)
        run: pnpm --filter create-nextrush test -- src/__tests__/generate-install-matrix.test.ts

  # T004 (close-phase0-ci-matrix-and-metadata-preflight): exercises `@nextrush/dev`'s `dev`
  # and `build` CLI commands on Windows and macOS against a minimal fixture, so platform-
  # specific regressions (path separators, line endings, process spawning) are caught before
  # release. Scoped to the dev/build CLI fixture only — not the full monorepo suite (see
  # design.md D4) — to bound CI cost and the blast radius of platform-runner flakiness.
  dev-cli-cross-platform:
    # Windows/macOS runners are substantially more expensive than Linux. Run
    # this compatibility proof explicitly rather than on every main push.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/dev-cli-fixture
    steps:
      - uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build the fixture's workspace dependencies (nextrush, @nextrush/dev)
        working-directory: .
        run: pnpm turbo run build --filter=dev-cli-fixture...

      # T013 (fix-dev-loader-resolution-and-build-proof): the @nextrush/dev vitest suite
      # (including build-e2e-integration.test.ts and cli-dev-integration.test.ts, both of
      # which spawn the real built CLI against this fixture) already runs on Linux via
      # `pnpm verify`/turbo `test` in the `ci` job above — this step is what runs it on
      # Windows/macOS too, per this task's own acceptance criteria ("runs in the Win/macOS/
      # Linux matrix", not only the original Linux job).
      - name: "@nextrush/dev test suite (includes build/dev e2e integration tests)"
        working-directory: .
        run: pnpm --filter @nextrush/dev test

      - name: nextrush build (produces expected output files)
        shell: bash
        run: |
          set -euo pipefail
          node ../../packages/dev/bin/nextrush.js build
          test -f dist/index.js

      - name: nextrush dev (smoke test — starts, responds, shuts down cleanly)
        shell: bash
        env:
          PORT: "8080"
        run: |
          set -euo pipefail
          node ../../packages/dev/bin/nextrush.js dev &
          DEV_PID=$!

          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
            wait "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=""
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${PORT}/" -o response.json; then
              READY="1"
              break
            fi
            sleep 1
          done

          if [ -z "$READY" ]; then
            echo "nextrush dev did not respond on port ${PORT} within 30s" >&2
            exit 1
          fi

          grep -q '"ok":true' response.json

          cleanup
          trap - EXIT

  # T005 (elevate-scaffolding-dx / task 5.3): the published-artifact proof. Where the
  # per-PR `create-nextrush-install-matrix` verifies emitted ranges against workspace
  # versions hermetically, this job exercises the REAL packed tarball in Docker — real
  # package managers (npm/pnpm/yarn/bun), real runtimes (node/deno/bun), and every
  # style × middleware cell — install, build, test, start, and health-check. Scheduled
  # nightly (and on-demand) so drift in the npm registry, runtime binaries, or the
  # packaged CLI surfaces before it reaches users; failures retain the generated
  # project and per-cell logs as artifacts (design decision 7).
  create-nextrush-published-matrix:
    # Run this expensive published-artifact proof only when explicitly requested.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build workspace packages the packed artifact resolves against
        run: pnpm --filter "create-nextrush..." build

      - name: Pack create-nextrush into the harness registry image
        working-directory: packages/create-nextrush
        run: |
          set -euo pipefail
          pnpm pack --pack-destination docker
          mv docker/create-nextrush-*.tgz docker/create-nextrush.tgz

      - name: Run the published-artifact matrix (pm × runtime × style × middleware)
        working-directory: packages/create-nextrush/docker
        run: ./run-matrix.sh

      - name: Upload retained failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: create-nextrush-matrix-failures
          path: packages/create-nextrush/docker/artifacts/**
          if-no-files-found: ignore
