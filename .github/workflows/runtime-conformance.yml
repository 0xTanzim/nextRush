# # Proves the adapters on their REAL runtimes (not simulated under Node/vitest):
# # - Bun adapter under real Bun (a real Bun.serve() server, hit over the network —
# #   Bun's fetch handler receives a live `server` param that a bare in-process call
# #   cannot reproduce; see bun-runner/conformance.bun.test.ts's header comment)
# # - Deno adapter under real Deno
# # - Edge adapter inside a real workerd isolate (miniflare)
# # See openspec/changes/harden-runtime-edge-serverless (task group 3) and
# # openspec/changes/close-runtime-compatibility-gaps (task group 3, Bun).
# #
# # Locally reproducible with `act`:
# #   act -j bun-conformance
# #   act -j deno-conformance
# #   act -j workerd-conformance
# # (see packages/adapters/conformance/README.md)
