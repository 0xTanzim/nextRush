name: Release

on:
  # Publishing is intentionally an explicit operator action. Never publish
  # packages as a side effect of pushing to main.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          registry-url: https://registry.npmjs.org

      # The changesets action is told NOT to create per-package GitHub Releases
      # (createGithubReleases: false). Publishing still pushes per-package git tags
      # (nextrush@4.0.1, @nextrush/core@4.0.1, ...) for provenance; the NEXT step turns each
      # wave into exactly ONE canonical framework release: NextRush vX.Y.Z — see
      # scripts/create-github-release.ts (run as `pnpm release:github`).
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: pnpm release
          version: pnpm run version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create canonical GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: pnpm release:github

      - name: Release notification
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "Packages published."
          node -e "const j = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]'); console.log(JSON.stringify(j, null, 2));"
