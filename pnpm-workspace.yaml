packages:
  - packages/*
  - packages/middleware/*
  - packages/extensions/*
  - packages/adapters/*
  - packages/interop/*
  - packages/adapters/conformance/deploy-verification/*
  - apps/*
  - examples/*

catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 10080

catalogs:
  tooling:
    typescript: "^7.0.2"
    zod: ^4.6.5
    # tsdown stage 2 of the RFC-037 D9 migration path: the tsup-compatible options were
    # eliminated (full-workspace deprecation-warning count = 0 under 0.22.14), so this
    # line now follows the current release. 0.23.x declares typescript "^5 || ^6 || ~7.0"
    # as an optional peer and builds declarations with oxc (rolldown-plugin-dts), never
    # the TypeScript JS API — it is TS 7-ready by construction.
    tsdown: "^0.23.0"
    rimraf: "^6.1.3"
    tsx: ^4.23.15
    eslint: "^9.39.5"
    oxlint: "1.83.0"
    oxlint-tsgolint: "7.0.2002"

  testing:
    vitest: "^4.1.10"
    "@vitest/ui": "^4.1.10"
    fast-check: "4.10.2"

  runtime:
    reflect-metadata: "^0.2.2"

  node:
    "@types/node": "^26.1.2"
    "@types/bun": "^1.3.14"

  web:
    next: "^16.3.0"
    react: ^19.3.0
    react-dom: ^19.3.0
    "@types/react": "^19.2.18"
    "@types/react-dom": "^19.2.4"

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

ignoredBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver

catalog:
  morgan: 1.10.0
  response-time: ^2.3.4  
