packages:
  - packages/*
  - packages/middleware/*
  - packages/extensions/*
  - packages/adapters/*
  - packages/adapters/conformance/deploy-verification/*
  - apps/*
  - examples/*

catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 10080

catalogs:
  tooling:
    typescript: "~6.0.3"
    zod: "^4.4.3"
    tsup: "^8.5.1"
    rimraf: "^6.1.3"
    tsx: "^4.23.9"

  testing:
    vitest: "^4.1.10"
    "@vitest/ui": "^4.1.10"
    fast-check: "4.9.0"

  runtime:
    reflect-metadata: "^0.2.2"

  node:
    "@types/node": "^26.1.2"
    "@types/bun": "^1.3.14"

  web:
    next: "^16.3.0"
    react: "^19.2.8"
    react-dom: "^19.2.8"
    "@types/react": "^19.2.18"
    "@types/react-dom": "^19.2.4"

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

ignoredBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver
